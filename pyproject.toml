[project]
name = "youarebot-cesar"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=0.23",
    "kagglehub>=1.0",
    "torch>=2.0",
    "scikit-learn>=1.5",
    "nbformat>=5.10",
    "ipykernel>=7.3",
    "ipywidgets>=8.1",
    "transformers[torch]>=5.12.1",
    "peft>=0.12",
    "mlflow>=2.15",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
