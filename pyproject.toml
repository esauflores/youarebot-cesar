[project]
name = "youarebot-cesar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.23",
    "kagglehub>=1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
eval = [
    "torch>=2.0",
    "transformers>=4.40",
    "scikit-learn>=1.5",
    "nbformat>=5.10",
    "ipykernel>=7.3",
]