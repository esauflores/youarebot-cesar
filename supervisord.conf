[supervisord]
nodaemon=true

[program:classifier]
command=uvicorn classifier_main:app --host 0.0.0.0 --port 8000
directory=/app
environment=ONNX_PATH="/app/classifier.onnx"

[program:llm]
command=python3 -m llama_cpp.server --model /models/Qwen3.5-0.8B-Q4_K_M.gguf --host 0.0.0.0 --port 8080 --n_ctx 1024
directory=/app
redirect_stderr=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
startretries=1
autorestart=false

[program:orchestrator]
command=uvicorn orchestrator_main:app --host 0.0.0.0 --port 8672
directory=/app
environment=CLASSIFIER_URL="http://localhost:8000",LLM_URL="http://localhost:8080"

[program:streamlit]
command=streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
directory=/app
environment=ORCHESTRATOR_URL="http://localhost:8672"
