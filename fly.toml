app = "esauflores2025-gmail-com-harbour-compose"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 8672

[[vm]]
  size = "shared-cpu-4x"
  memory = "3gb"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
