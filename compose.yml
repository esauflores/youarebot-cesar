services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student_pass
      POSTGRES_DB: chat_db

  classifier:
    build: ./classifier
    ports:
      - "8000:8000"

  orchestrator:
    build: ./orchestrator
    depends_on:
      - classifier
      - llm
    ports:
      - "8672:8672"
    environment:
      CLASSIFIER_URL: http://classifier:8000
      LLM_URL: http://llm:8080
      DATABASE_URL: postgresql://student:student_pass@postgres:5432/chat_db

  llm:
    build: ./llm
    ports:
      - "8080:8080"

  streamlit:
    build: ./streamlit
    depends_on:
      - orchestrator
    ports:
      - "8501:8501"
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8672
